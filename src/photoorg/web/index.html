<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivio foto</title>
<link rel="icon" href="/static/icon.png">
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/js/main.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-copies" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.5 3.5 8 12 12.5 20.5 8z"/><path d="m3.5 12 8.5 4.5 8.5-4.5"/><path d="m3.5 16 8.5 4.5 8.5-4.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5"/><path d="M12 16.3v.2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7a2 2 0 0 1 2-2h3.8l2 2h7.2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4.5H15"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><path d="M12 7.7v.2"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M9 6.8v10.4a.6.6 0 0 0 .9.5l8.2-5.2a.6.6 0 0 0 0-1L9.9 6.3a.6.6 0 0 0-.9.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 20.5s-6-5.4-6-10a6 6 0 1 1 12 0c0 4.6-6 10-6 10z"/><circle cx="12" cy="10.5" r="2.1"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10.5 5 5 5-5"/><path d="M5 19.5h14"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1.3A4.5 4.5 0 0 1 17 18.5z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="3" width="11" height="18" rx="2.5"/><path d="M10.5 18h3"/></symbol>
    <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="2.5"/><path d="M7 14.5h.01M10 14.5h.01"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6h-6v6H5.5A1.5 1.5 0 0 1 4 19z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15"/><path d="M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2"/><path d="M6.5 7l.8 11.6a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9L17.5 7"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5V9H9"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4 2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.3l-4.8 2.6.9-5.4-3.9-3.8 5.4-.8z"/></symbol>
    <symbol id="i-album" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m4 15 4.5-4.5 4 4 2.5-2.5L20 17"/><circle cx="15.5" cy="9.5" r="1.3"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4 12.6V5a1 1 0 0 1 1-1h7.6a1 1 0 0 1 .7.3l6.5 6.5a1 1 0 0 1 0 1.4l-7.6 7.6a1 1 0 0 1-1.4 0l-6.5-6.5a1 1 0 0 1-.3-.7z"/><circle cx="8.5" cy="8.5" r="1.3"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-split" viewBox="0 0 24 24"><path d="M7 4v6a2 2 0 0 0 2 2h6a2 2 0 0 1 2 2v6"/><path d="M17 4v4M7 16v4"/></symbol>
  </defs>
</svg>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="/static/icon.png" alt="" width="28" height="28"><span>Archivio foto</span></div>

    <label class="user-switch" hidden>
      <span class="sr-only">Archivio di</span>
      <select id="user"></select>
    </label>

    <nav class="nav" aria-label="Sezioni">
      <a href="#/panoramica" data-route="panoramica"><svg class="icon"><use href="#i-home"/></svg><span>Panoramica</span></a>
      <a href="#/galleria" data-route="galleria"><svg class="icon"><use href="#i-grid"/></svg><span>Galleria</span><span class="count" data-count="assets"></span></a>
      <span class="nav-sep" aria-hidden="true"></span>
      <a href="#/duplicati" data-route="duplicati"><svg class="icon"><use href="#i-copies"/></svg><span>Duplicati</span><span class="count attention-when" data-count="duplicates"></span></a>
      <a href="#/varianti" data-route="varianti"><svg class="icon"><use href="#i-layers"/></svg><span>Raffiche</span><span class="count attention-when" data-count="variants_todo"></span></a>
      <a href="#/verifica" data-route="verifica"><svg class="icon"><use href="#i-alert"/></svg><span>Date da verificare</span><span class="count attention-when" data-count="issues"></span></a>
      <span class="nav-sep" aria-hidden="true"></span>
      <a href="#/cestino" data-route="cestino"><svg class="icon"><use href="#i-trash"/></svg><span>Cestino</span><span class="count" data-count="excluded"></span></a>
      <a href="#/fonti" data-route="fonti"><svg class="icon"><use href="#i-folder"/></svg><span>Fonti</span></a>
    </nav>

    <div class="sidebar-foot">
      <div class="job-mini" id="job-mini" hidden>
        <div class="job-mini-phase"></div>
        <div class="bar"><span></span></div>
      </div>
      <button class="btn" id="scan-btn" type="button" aria-label="Aggiorna archivio"><svg class="icon"><use href="#i-refresh"/></svg><span class="label">Aggiorna archivio</span></button>
    </div>
  </aside>

  <main class="main" id="main" tabindex="-1">
    <div id="view-galleria" class="view" hidden></div>
    <div id="view-other" class="view" hidden></div>
  </main>
</div>

<div class="selbar" id="selbar" role="toolbar" aria-label="Azioni sulla selezione" hidden></div>

<dialog class="sheet" id="sheet">
  <form method="dialog">
    <h2></h2>
    <p class="sheet-text"></p>
    <div class="sheet-body"></div>
    <div class="sheet-actions">
      <button class="btn btn-quiet" type="submit" value="cancel">Annulla</button>
      <button class="btn btn-primary" type="submit" value="ok"></button>
    </div>
  </form>
</dialog>

<datalist id="names-album"></datalist>
<datalist id="names-person"></datalist>
<datalist id="names-keyword"></datalist>

<div class="pending" id="pending" hidden>
  <span>Hai scelte da applicare ai gruppi di duplicati.</span>
  <button class="btn btn-primary" id="apply-btn" type="button">Applica</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
