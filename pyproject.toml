[project]
name = "photoorg"
version = "0.1.0"
description = "Consolidamento archivi foto da Google Takeout, Android e iPhone"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=11.0",
    "pillow-heif>=0.18",
    "imagehash>=4.3",
    "tzdata>=2024.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # local AI: faces (OpenCV YuNet + SFace), tags and search (CLIP via ONNX Runtime, GPU through DirectML)
    "opencv-python-headless>=4.10",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "onnxruntime>=1.20; sys_platform != 'win32'",
    "tokenizers>=0.20",
    "safetensors>=0.4",
]

[project.scripts]
photoorg = "photoorg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
